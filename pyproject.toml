[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceforge"
version = "0.1.0"
description = "Open-source WebRTC voice agent server with sub-80ms Silero VAD barge-in interruption and streaming pipelines"
authors = [
    { name = "Alexandr Motologa", email = "alexandr.motologa@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "voice-ai",
    "realtime-ai",
    "webrtc",
    "silero-vad",
    "barge-in",
    "speech-to-text",
    "text-to-speech",
    "fastapi",
    "aiortc"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "aiortc>=1.9.0",
    "onnxruntime>=1.18.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "soundfile>=0.12.1",
    "pyttsx3>=2.90",
    "psutil>=5.9.0",
    "faster-whisper>=1.0.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0"
]

[project.optional-dependencies]
cloud = [
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "google-genai>=0.1.0"
]
local = [
    "faster-whisper>=1.0.0"
]
all = [
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "google-genai>=0.1.0",
    "faster-whisper>=1.0.0"
]

[project.scripts]
voiceforge = "src.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

